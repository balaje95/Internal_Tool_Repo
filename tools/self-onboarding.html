<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuper Self-Onboarding</title>
<link rel="icon" href="../assets/logos/zuper-favicon.svg">
<link rel="stylesheet" href="../assets/zuper-brand.css">
<script>try{if(localStorage.getItem('zuper_tools_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
  /* Light is the default theme; dark is opt-in via [data-theme="dark"]. */
  :root{
    --bg:var(--zb-warm); --panel:var(--zb-white); --panel2:var(--zb-peach);
    --line:var(--zb-border); --line2:var(--zb-border-strong);
    --txt:var(--zb-ink); --muted:var(--zb-text-2); --accent:var(--zb-primary); --accent2:var(--zb-primary-hover);
    --ok:var(--zb-success); --okbg:var(--zb-success-bg); --err:var(--zb-error); --errbg:var(--zb-error-bg);
    --warn:var(--zb-warning); --warnbg:var(--zb-warning-bg);
    --chip:var(--zb-banner); --code:var(--zb-gray-50);
    --headbg:linear-gradient(180deg,var(--zb-white),var(--zb-warm)); --rowhover:var(--zb-hover);
  }
  :root[data-theme="dark"]{
    --bg:#09090B; --panel:#141417; --panel2:#1C1C21; --line:#27272A; --line2:#3F3F46;
    --txt:#FAFAFA; --muted:#A1A1AA; --accent:#FF8B5A; --accent2:#F2864F;
    --ok:#4ADE80; --okbg:#0F2A1B; --err:#F87171; --errbg:#3A1A1E; --warn:#FBBF24; --warnbg:#3A2F12;
    --chip:#27272A; --code:#09090B; --headbg:linear-gradient(180deg,#141417,#09090B); --rowhover:#1C1C21;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--zb-font-body);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
  a{color:var(--accent)}
  header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--headbg);flex-wrap:wrap}
  header h1{font-size:1.15rem;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:.8rem}
  .head-spacer{flex:1}
  .theme-btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:.8rem;font-weight:600;cursor:pointer}
  .theme-btn:hover{border-color:var(--accent)}
  #badge{font-size:.8rem;color:var(--ok);background:var(--okbg);padding:6px 12px;border-radius:20px;display:none}
  .tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
  .tab{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:12px 16px;color:var(--muted);font-weight:600;white-space:nowrap}
  .tab.on{color:var(--txt);border-bottom-color:var(--accent)}
  .tab .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);align-items:center;justify-content:center;font-size:.72rem;margin-right:6px}
  .tab.on .n{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 26px 80px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
  .card h2{font-size:1rem;margin:0 0 4px;font-weight:600}
  .card h3{font-size:.9rem;margin:18px 0 8px;font-weight:600}
  .desc{color:var(--muted);font-size:.83rem;margin:0 0 16px}
  label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 5px;font-weight:500}
  .inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 11px;font-size:.88rem;outline:none;font-family:inherit}
  .inp:focus{border-color:var(--accent)}
  textarea.inp{min-height:70px;resize:vertical}
  .inp.sm{padding:5px 8px;font-size:.82rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  button{cursor:pointer;font-family:inherit;font-size:.86rem;font-weight:600;border:none;border-radius:8px;padding:9px 16px;transition:.15s}
  .btn{background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent2)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.sec:hover{border-color:var(--accent)}
  .btn.danger{background:var(--err);color:#fff}
  .btn.tiny{padding:4px 9px;font-size:.76rem}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)} .small{font-size:.78rem}
  .hidden{display:none!important}
  .msg{display:none;margin-top:12px;padding:9px 13px;border-radius:8px;font-size:.83rem}
  .msg-ok{background:var(--okbg);color:var(--ok)} .msg-err{background:var(--errbg);color:var(--err)}
  .msg-info{background:var(--chip);color:var(--accent2)} .msg-warn{background:var(--warnbg);color:var(--warn)}
  /* wizard layout */
  .wiz{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
  .wiz>*,.card,.jt{min-width:0}
  .steps{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:12px}
  .stp{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;color:var(--txt);padding:8px 10px;font-weight:500;font-size:.84rem}
  .stp:hover{background:var(--rowhover)}
  .stp.on{background:var(--chip);color:var(--accent2);font-weight:600}
  .stp .d{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;flex:none}
  .stp.on .d{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stp.done .d{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
  .wiznav{display:flex;justify-content:space-between;margin-top:6px}
  @media (max-width:820px){.wiz{grid-template-columns:minmax(0,1fr)}.wrap{padding:16px 16px 60px}header{padding:14px 16px}.tabs{padding:0 16px}.steps{position:static;display:flex;overflow-x:auto}.stp{white-space:nowrap}}
  /* choice chips */
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:6px 13px;font-size:.83rem;cursor:pointer;user-select:none}
  .choice.on{border-color:var(--accent);background:var(--chip);color:var(--accent2);font-weight:600}
  .choice input{display:none}
  /* tables */
  .tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:.83rem}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{background:var(--panel2);font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tr:hover td{background:var(--rowhover)}
  td.c{text-align:center}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  /* job type cards */
  .jt{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .jt-h{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel2);flex-wrap:wrap}
  .jt-h b{flex:1;min-width:140px}
  .jt.off .jt-h{opacity:.6}
  .sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
  .pill{font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
  .pill.err{background:var(--errbg);color:var(--err);border-color:transparent}
  .pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
  .pill.info{background:var(--chip);color:var(--accent2);border-color:transparent}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 15px;min-width:110px}
  .stat b{display:block;font-size:1.25rem}
  .stat span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
  .log{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:.76rem;max-height:260px;overflow:auto;white-space:pre-wrap;margin-top:12px}
  .log .l-ok{color:var(--ok)} .log .l-err{color:var(--err)} .log .l-info{color:var(--accent2)} .log .l-warn{color:var(--warn)}
  .progress{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:12px 0}
  .progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
  pre.json{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.74rem;max-height:420px;overflow:auto}
  .icon-btn{background:none;border:none;padding:2px 6px;color:var(--muted);font-size:.9rem}
  .icon-btn:hover{color:var(--accent)}
  .note{border-left:3px solid var(--accent);background:var(--chip);padding:9px 13px;border-radius:0 8px 8px 0;font-size:.82rem;margin:10px 0}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .modal{position:fixed;z-index:51;left:50%;top:4vh;transform:translateX(-50%);width:min(980px,calc(100vw - 32px));max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .pill.man{background:var(--warnbg);color:var(--warn);border-color:transparent}
  /* handover print */
  #handover h2{margin-top:6px}
  @media print{header,.tabs,.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}}
</style>
</head>
<body>
<header>
  <img class="zb-logo" src="../assets/logos/zuper-horizontal.svg" alt="Zuper">
  <h1>Self-Onboarding</h1>
  <span class="sub">Answer the questionnaire → review the blueprint → configure the account → hand it over</span>
  <span class="head-spacer"></span>
  <span id="badge"></span>
  <button class="theme-btn" onclick="exportBlueprint()" title="Download the answers as a blueprint JSON">⬇ Blueprint</button>
  <button class="theme-btn" onclick="$('importFile').click()" title="Load a saved blueprint JSON">⬆ Load</button>
  <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBlueprint(this)">
  <button class="theme-btn" onclick="resetAll()" title="Clear all answers and start over">↺ Reset</button>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap" id="main"></div>

<script src="../assets/back-link.js"></script>
<script src="../assets/zuper-panel-bridge.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase();
const uidish=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const DRAFT_KEY='zso_blueprint_v1';

/* ============================================================
   DEFAULT ROOFING TEMPLATE — every answer starts pre-filled.
   Status types are Zuper's job status_type enum.
   ============================================================ */
const STATUS_TYPES=['NEW','SCHEDULED','ON_MY_WAY','IN_PROGRESS','COMPLETED','CANCELLED','CUSTOM'];
const FIELD_TYPES={SINGLE_LINE:'Text',MULTI_LINE:'Long text',NUMBER:'Number',DATE:'Date',SINGLE_ITEM:'Dropdown',MULTI_ITEM:'Multi-select',RADIO:'Yes / No'};
const TIMEZONES=['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu','America/Toronto','America/Vancouver','Europe/London','Australia/Sydney','Asia/Kolkata'];

// s(name,type,{f:fieldVisible,sig:signature,t:trackTime})
function st(name,type,o={}){return{name,type,field:!!o.f,sign:!!o.sig,track:!!o.t};}
const FIELD_STAGES=()=>[st('Scheduled','SCHEDULED',{f:1}),st('On My Way','ON_MY_WAY',{f:1}),st('In Progress','IN_PROGRESS',{f:1,t:1})];

function defaultJobTypes(){
  return [
    {key:'replacement',name:'Roof Replacement',enabled:true,color:'#E4572E',days:2,hours:0,stages:[
      st('Lead','NEW'),st('Inspection Scheduled','SCHEDULED',{f:1}),st('Inspection Complete','CUSTOM',{f:1}),
      st('Proposal Sent','CUSTOM'),st('Contract Signed','CUSTOM'),st('Permit & Materials Ordered','CUSTOM'),
      st('Install Scheduled','SCHEDULED',{f:1}),st('Crew On The Way','ON_MY_WAY',{f:1}),st('Install In Progress','IN_PROGRESS',{f:1,t:1}),
      st('Final Walkthrough','CUSTOM',{f:1,sig:1}),st('Invoiced','CUSTOM'),st('Paid & Closed','COMPLETED'),st('Cancelled','CANCELLED')]},
    {key:'repair',name:'Roof Repair',enabled:true,color:'#F4A259',days:0,hours:4,stages:[
      st('New','NEW'),...FIELD_STAGES(),st('Completed','COMPLETED',{f:1,sig:1}),st('Invoiced','CUSTOM'),st('Cancelled','CANCELLED')]},
    {key:'inspection',name:'Roof Inspection / Estimate',enabled:true,color:'#3B82F6',days:0,hours:2,stages:[
      st('New','NEW'),st('Scheduled','SCHEDULED',{f:1}),st('On My Way','ON_MY_WAY',{f:1}),st('Inspecting','IN_PROGRESS',{f:1,t:1}),
      st('Inspection Complete','COMPLETED',{f:1}),st('Cancelled','CANCELLED')]},
    {key:'insurance',name:'Insurance Claim',enabled:true,color:'#8B5CF6',days:2,hours:0,stages:[
      st('Lead','NEW'),st('Inspection Scheduled','SCHEDULED',{f:1}),st('Claim Filed','CUSTOM'),st('Adjuster Meeting','SCHEDULED',{f:1}),
      st('Claim Approved','CUSTOM'),st('Claim Denied','CUSTOM'),st('Supplement Submitted','CUSTOM'),
      st('Install Scheduled','SCHEDULED',{f:1}),st('Crew On The Way','ON_MY_WAY',{f:1}),st('Install In Progress','IN_PROGRESS',{f:1,t:1}),
      st('Depreciation Requested','CUSTOM'),st('Paid & Closed','COMPLETED'),st('Cancelled','CANCELLED')]},
    {key:'emergency',name:'Emergency Leak Repair',enabled:true,color:'#DC2626',days:0,hours:3,stages:[
      st('New','NEW'),st('Dispatched','SCHEDULED',{f:1}),st('On My Way','ON_MY_WAY',{f:1}),st('Tarping / Temporary Fix','IN_PROGRESS',{f:1,t:1}),
      st('Completed','COMPLETED',{f:1,sig:1}),st('Cancelled','CANCELLED')]},
    {key:'newconstruction',name:'New Construction Roof',enabled:false,color:'#10B981',days:3,hours:0,stages:[
      st('New','NEW'),st('Materials Ordered','CUSTOM'),...FIELD_STAGES(),st('Completed','COMPLETED',{f:1}),st('Invoiced','CUSTOM'),st('Cancelled','CANCELLED')]},
    {key:'gutters',name:'Gutter Installation',enabled:false,color:'#0EA5E9',days:1,hours:0,stages:[
      st('New','NEW'),...FIELD_STAGES(),st('Completed','COMPLETED',{f:1,sig:1}),st('Cancelled','CANCELLED')]},
    {key:'maintenance',name:'Roof Maintenance',enabled:false,color:'#64748B',days:0,hours:2,stages:[
      st('New','NEW'),...FIELD_STAGES(),st('Completed','COMPLETED',{f:1}),st('Cancelled','CANCELLED')]},
  ];
}
function defaultChecklists(){
  return [
    {key:'safety',name:'Job Site Safety Checklist',enabled:true,job:'*',stage:'Install In Progress',fields:'PPE worn by all crew (Yes/No)\nFall protection set up (Yes/No)\nLadders secured (Yes/No)\nSite hazards noted\nPhoto of setup'},
    {key:'inspection',name:'Roof Inspection Report',enabled:true,job:'inspection',stage:'Inspecting',fields:'Roof material\nRoof age (years)\nNumber of layers\nPitch\nDamage observed\nDecking condition\nVentilation adequate (Yes/No)\nPhotos of each slope'},
    {key:'postinstall',name:'Post-Installation Inspection',enabled:true,job:'replacement',stage:'Final Walkthrough',fields:'Debris and nails cleaned up (Yes/No)\nFlashing sealed (Yes/No)\nVents and pipe boots installed (Yes/No)\nGutters clear (Yes/No)\nFinal photos\nCustomer signature'},
    {key:'delivery',name:'Material Delivery Check',enabled:false,job:'replacement',stage:'Permit & Materials Ordered',fields:'Delivery date\nAll materials received (Yes/No)\nShortages / damages\nPhoto of delivery'},
    {key:'leak',name:'Leak Assessment',enabled:false,job:'emergency',stage:'Tarping / Temporary Fix',fields:'Leak source\nInterior damage (Yes/No)\nTarp installed (Yes/No)\nPermanent repair needed (Yes/No)\nPhotos'},
  ];
}
function defaultCustomFields(){
  const f=(module,name,type,enabled,options='')=>({id:uidish(),module,name,type,enabled,options});
  return [
    f('JOB','Insurance Carrier','SINGLE_LINE',true),f('JOB','Claim Number','SINGLE_LINE',true),
    f('JOB','Adjuster Name','SINGLE_LINE',true),f('JOB','Adjuster Phone','SINGLE_LINE',true),
    f('JOB','Deductible','NUMBER',true),f('JOB','Date of Loss','DATE',true),
    f('JOB','Roof Material','SINGLE_ITEM',true,'Asphalt Shingle, Metal, TPO, EPDM, Tile, Slate'),
    f('JOB','Roof Pitch','SINGLE_LINE',false),f('JOB','Number of Layers','NUMBER',false),f('JOB','Roof Squares','NUMBER',true),
    f('JOB','Permit Number','SINGLE_LINE',true),
    f('CUSTOMER','Lead Source','SINGLE_ITEM',true,'Referral, Google, Facebook, Door Knock, Storm Canvass, Repeat Customer, Other'),
    f('CUSTOMER','Preferred Contact Method','SINGLE_ITEM',false,'Call, Text, Email'),
    f('PROPERTY','Gate / Access Code','SINGLE_LINE',false),f('PROPERTY','HOA','RADIO',false),f('PROPERTY','Year Built','NUMBER',false),
  ];
}
const PRODUCT_CATS=['Shingles','Underlayment','Ice & Water Shield','Starter','Hip & Ridge','Drip Edge','Flashing','Vents','Pipe Boots','Fasteners','Decking','Metal Roofing','Low Slope / Flat','Gutters','Roofing Services','Dump & Disposal','Permits & Fees'];
function defaultServices(){
  const s=(name,uom,price,enabled=true)=>({id:uidish(),name,uom,price,enabled});
  return [s('Tear-Off (per layer)','SQ',0),s('Shingle Installation Labor','SQ',0),s('Decking Replacement','SHEET',0),
    s('Dumpster & Disposal','EA',0),s('Permit Fee','EA',0),s('Roof Inspection','EA',0,false),s('Emergency Tarp','EA',0,false),s('Gutter Installation','LF',0,false)];
}
function defaultNotifications(){
  return [
    {key:'insp',name:'Inspection Scheduled',enabled:true,type:'SMS',job:'*',stage:'Inspection Scheduled',subject:'',body:'Hi {{customer.customer_first_name}}, your roof inspection with {{company.company_name}} is confirmed. We will text you when our inspector is on the way.'},
    {key:'omw',name:'Crew On The Way',enabled:true,type:'SMS',job:'*',stage:'Crew On The Way',subject:'',body:'Hi {{customer.customer_first_name}}, our crew from {{company.company_name}} is on the way to your property now.'},
    {key:'omw2',name:'Technician On The Way',enabled:true,type:'SMS',job:'*',stage:'On My Way',subject:'',body:'Hi {{customer.customer_first_name}}, our technician from {{company.company_name}} is on the way to your property now.'},
    {key:'done',name:'Job Complete + Review Request',enabled:true,type:'EMAIL',job:'*',stage:'Paid & Closed',subject:'Thank you for choosing {{company.company_name}}!',body:'Hi {{customer.customer_first_name}}, thank you for trusting us with your roof. If you were happy with our work, we would really appreciate a quick review.'},
    {key:'insched',name:'Install Scheduled',enabled:false,type:'EMAIL',job:'*',stage:'Install Scheduled',subject:'Your roof installation is scheduled',body:'Hi {{customer.customer_first_name}}, your installation is on the calendar. Please make sure driveways are clear and pets are secured on install day.'},
  ];
}
function defaultBlueprint(){
  return {
    version:1, updated_at:'',
    company:{name:'',contact_name:'',contact_email:'',contact_phone:'',address:'',timezone:'America/Chicago',hours_start:'08:00',hours_end:'17:00',
      workdays:['Mon','Tue','Wed','Thu','Fri'],currency:'USD',current_software:'',go_live:''},
    segments:['Residential'], trades:['Roofing'],
    job_types:defaultJobTypes(), checklists:defaultChecklists(), custom_fields:defaultCustomFields(),
    product_categories:PRODUCT_CATS.map(n=>({name:n,enabled:true})),
    suppliers:[], manufacturers:[], materials:['Asphalt Shingles'], services:defaultServices(), catalog_items:[],
    proposals:{measurement:[],gbb:true,financing:'',warranty:'',terms:''},
    payments:{deposit_pct:'',terms:'Due on receipt',methods:['Card','Check'],accounting:''},
    notifications:defaultNotifications(),
    users:[], teams:['Sales','Production','Repair Crew'],
    integrations:[], notes:'',
  };
}

/* ============================================================
   STATE
   ============================================================ */
let B=loadDraft()||defaultBlueprint();
let ui={tab:'q',step:0,openJt:null};
let conn={base:'',key:'',account:'',region:''};
let existing=null;   // snapshot of the target account
let plan=[];         // planned actions
let lastRun=null;    // results of the last apply (feeds handover)

function loadDraft(){try{const s=localStorage.getItem(DRAFT_KEY);if(!s)return null;const b=JSON.parse(s);return b&&b.version===1?normalizeBlueprint(b):null;}catch(e){return null;}}
// Merge onto defaults and drop values earlier versions allowed (e.g. suppliers other than SRS/ABC/QXO).
function normalizeBlueprint(b){
  const o=Object.assign(defaultBlueprint(),b);
  o.suppliers=(o.suppliers||[]).map(s=>/srs/i.test(s)?'SRS':/abc/i.test(s)?'ABC':/qxo|beacon/i.test(s)?'QXO':null).filter((s,i,a)=>s&&a.indexOf(s)===i);
  if(!Array.isArray(o.catalog_items))o.catalog_items=[];
  return o;
}
let _saveT=null;
function save(){B.updated_at=new Date().toISOString();clearTimeout(_saveT);_saveT=setTimeout(()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(B));}catch(e){}},250);}
// set a value by dotted path, e.g. set('company.name', v)
function setp(path,val){const ks=path.split('.');let o=B;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks.at(-1)]=val;save();}
function getp(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],B);}
function toggleIn(path,val){const a=getp(path)||[];const i=a.indexOf(val);if(i>=0)a.splice(i,1);else a.push(val);setp(path,a);render();}

const inp=(path,ph='',type='text')=>`<input class="inp" type="${type}" value="${esc(getp(path)??'')}" placeholder="${esc(ph)}" oninput="setp('${path}',this.value)">`;
const area=(path,ph='')=>`<textarea class="inp" placeholder="${esc(ph)}" oninput="setp('${path}',this.value)">${esc(getp(path)??'')}</textarea>`;
const fld=(lbl,html,help='')=>`<div><label>${lbl}</label>${html}${help?`<div class="small muted" style="margin-top:4px">${help}</div>`:''}</div>`;
function chips(path,options){
  const cur=getp(path)||[];
  return `<div class="choices">${options.map(o=>`<span class="choice ${cur.includes(o)?'on':''}" onclick="toggleIn('${path}',${esc(JSON.stringify(o))})">${cur.includes(o)?'✓ ':''}${esc(o)}</span>`).join('')}</div>`;
}
function chipsOther(path,options){
  const cur=getp(path)||[];const extra=cur.filter(x=>!options.includes(x));
  return chips(path,[...options,...extra])+`<div class="flex" style="margin-top:8px"><input class="inp sm" style="max-width:260px" placeholder="Add another…" onkeydown="if(event.key==='Enter'&&this.value.trim()){toggleIn('${path}',this.value.trim());}"><span class="small muted">press Enter</span></div>`;
}

/* GET user/company (+ the API user) → pre-fill the company step. Field names vary by
   account, so each value is read from the first key that has one. Only blank answers
   are filled unless force=true. */
async function autofillCompany(force){
  const pick=(o,keys)=>{for(const k of keys){const v=k.split('.').reduce((x,p)=>x==null?x:x[p],o);if(v!=null&&v!==''&&typeof v!=='object')return String(v);}return '';};
  const [cr,ur1,ur2]=await Promise.all([api('GET','user/company'),api('GET','user/me'),api('GET','users/me')]);
  const c=cr.json?.data||cr.json?.company||cr.json||{};
  const u=(ur1.ok?(ur1.json?.data||ur1.json):null)||(ur2.ok?(ur2.json?.data||ur2.json):null)||{};
  const addrObj=c.company_address||c.address||c.billing_address||{};
  const addr=typeof addrObj==='string'?addrObj:[addrObj.street,addrObj.city,addrObj.state,addrObj.zip_code||addrObj.zipcode||addrObj.postal_code,addrObj.country].filter(Boolean).join(', ');
  const found={
    name:pick(c,['company_name','name','company_display_name']),
    contact_name:pick(u,['full_name','name'])||[pick(u,['first_name']),pick(u,['last_name'])].filter(Boolean).join(' ')||pick(c,['contact_person','owner_name']),
    contact_email:pick(u,['email','email_id'])||pick(c,['company_email','email','support_email']),
    contact_phone:pick(u,['mobile_phone_number','work_phone_number','phone_number','phone'])||pick(c,['company_phone','phone','phone_number','contact_no','company_contact_no']),
    address:addr,
    timezone:pick(c,['company_timezone','timezone','time_zone','company_settings.timezone']),
    currency:pick(c,['currency','company_currency','currency_code','company_settings.currency']),
  };
  let n=0;
  for(const [k,v] of Object.entries(found)){if(v&&(force||!B.company[k]||k==='timezone'||k==='currency')){B.company[k]=v;n++;}}
  if(found.timezone&&!TIMEZONES.includes(found.timezone))TIMEZONES.unshift(found.timezone);
  if(found.currency&&!CURRENCIES.includes(found.currency))CURRENCIES.unshift(found.currency);
  ui.af=cr.ok?{t:'ok',m:'✓ Filled '+n+' field(s) from your Zuper account. Check them below and correct anything that\'s off.'}:{t:'warn',m:'Could not read company details ('+errOf(cr)+'). Please fill them in below.'};
  save();render();
}

function mvStage(ji,si,d){const a=B.job_types[ji].stages;const t=si+d;if(t<0||t>=a.length)return;[a[si],a[t]]=[a[t],a[si]];save();render();}
function stageWarnings(j){
  const w=[];const names=j.stages.map(s=>norm(s.name));
  if(!j.stages.some(s=>s.type==='NEW')) w.push('No NEW stage — jobs need a starting status');
  if(!j.stages.some(s=>s.type==='COMPLETED')) w.push('No COMPLETED stage');
  if(new Set(names).size!==names.length) w.push('Duplicate stage names');
  if(j.stages.some(s=>!s.name.trim())) w.push('A stage has no name');
  return w;
}
function stageOptions(jobKey,cur){
  const jobs=jobKey==='*'?B.job_types.filter(j=>j.enabled):B.job_types.filter(j=>j.key===jobKey);
  const names=[...new Set(jobs.flatMap(j=>j.stages.map(s=>s.name)))];
  if(cur&&!names.includes(cur)) names.unshift(cur);
  return names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
}
// The stage dropdown shows its first option even when nothing is stored, so always store
// a real stage: on create, and when the job changes to one that lacks the current stage.
function stageNames(jobKey){const jobs=jobKey==='*'?B.job_types.filter(j=>j.enabled):B.job_types.filter(j=>j.key===jobKey);return [...new Set(jobs.flatMap(j=>j.stages.map(s=>s.name)))];}
function firstStage(jobKey){return stageNames(jobKey)[0]||'';}
function setTarget(item,jobKey){item.job=jobKey;if(!stageNames(jobKey).includes(item.stage))item.stage=firstStage(jobKey);save();render();}
function jobOptions(cur,allowAll=true){

}

async function catSearch(reset){
  const cfg=CATALOG[cat.src];if(reset)cat.page=0;const token=++cat.token;
  cat.busy=true;cat.err='';renderCatalog();
  const p=new URLSearchParams();
  p.set('select',[cfg.id,cfg.name,cfg.category,cfg.brand,cfg.tier,cfg.uom].filter(Boolean).join(','));
  const q=String(cat.q||'').replace(/[(),*]/g,' ').trim();
  if(q){const parts=[cfg.name,cfg.brand,cfg.category].map(c=>c+'.ilike.*'+q+'*');
    if(!cfg.numericId)parts.push(cfg.id+'.ilike.*'+q+'*');else if(/^\d{1,9}$/.test(q))parts.push(cfg.id+'.eq.'+q);
    p.set('or','('+parts.join(',')+')');}
  if(cat.brand)p.set(cfg.brand,'ilike.*'+cat.brand.replace(/[(),*]/g,' ').trim()+'*');
  p.set('order',cfg.name+'.asc');
  try{
    const from=cat.page*50;
    const res=await fetch(CAT_BASE+'/'+cfg.table+'?'+p.toString(),{headers:{...CAT_HDRS,'Range-Unit':'items','Range':from+'-'+(from+49),...(reset?{Prefer:'count=exact'}:{})}});
    if(token!==cat.token)return;
    if(res.status===404)throw new Error('the catalog database is connected but its tables have not been loaded yet. Run the catalog restore, then try again');
    if(!res.ok)throw new Error('HTTP '+res.status);
    cat.rows=await res.json();
    if(reset){const t=parseInt(((res.headers.get('content-range')||'').split('/')[1]||''),10);cat.total=Number.isFinite(t)?t:cat.rows.length;}
  }catch(e){if(token!==cat.token)return;cat.rows=[];
    cat.err=e instanceof TypeError
      ?'The supplier catalog is offline right now: its database server can\'t be reached, which also affects the Product Catalog tool. You can carry on without catalog items and add them later.'
      :'Catalog search failed: '+e.message;}
  cat.busy=false;renderCatalog();
}
function catItem(r){const cfg=CATALOG[cat.src];return {src:cat.src,id:String(r[cfg.id]),name:r[cfg.name]||'',category:r[cfg.category]||'',brand:r[cfg.brand]||'',uom:(cfg.uom&&r[cfg.uom])||'EA'};}
function catToggle(i,on){const it=catItem(cat.rows[i]);B.catalog_items=B.catalog_items.filter(x=>!(x.src===it.src&&x.id===it.id));if(on)B.catalog_items.push(it);save();renderCatalog();}
function catTogglePage(on){cat.rows.forEach((r,i)=>{const it=catItem(r);B.catalog_items=B.catalog_items.filter(x=>!(x.src===it.src&&x.id===it.id));if(on)B.catalog_items.push(it);});save();renderCatalog();}

function issues(){
  const out=[];
  if(!B.company.name.trim()) out.push({s:0,m:'Company name is missing'});
  if(!B.company.contact_email.trim()) out.push({s:0,m:'Primary contact email is missing'});
  const on=B.job_types.filter(j=>j.enabled);
  if(!on.length) out.push({s:2,m:'No job types selected'});
  const jn=on.map(j=>norm(j.name)); if(new Set(jn).size!==jn.length) out.push({s:2,m:'Two job types have the same name'});
  on.forEach(j=>stageWarnings(j).forEach(w=>out.push({s:3,m:j.name+': '+w})));
  B.checklists.filter(c=>c.enabled).forEach(c=>{if(!c.fields.trim())out.push({s:4,m:'Checklist "'+c.name+'" has no questions'});else if(!targetsFor(c).length)out.push({s:4,m:'Checklist "'+c.name+'" is not attached to a stage that exists'});});
  B.custom_fields.filter(f=>f.enabled&&!f.name.trim()).forEach(()=>out.push({s:5,m:'A custom field has no name'}));
  B.notifications.filter(n=>n.enabled).forEach(n=>{if(!n.body.trim())out.push({s:8,m:'Message "'+n.name+'" has no text'});if(!targetsFor(n).length)out.push({s:8,m:'Message "'+n.name+'" matches no job stage'});});
  B.users.forEach((u,i)=>{if(u.email&&!/^\S+@\S+\.\S+$/.test(u.email))out.push({s:9,m:'User '+(i+1)+' has an invalid email'});});
  return out;
}

   ============================================================ */
const ZUPER_CLIENT_HDRS={'x-zuper-client':'WEB_APP','x-zuper-client-version':'3.0'};
const ZUPER_DCS=window.ZUPER_DCS||['us-east-1','us-east-1a','us-east-1b','us-east-1c','us-west-1','us-west-1a','us-west-1b','us-west-1c','us-west-2',
  'eu-west-1','eu-west-2','eu-central-1','ap-south-1','ap-south-2','ap-southeast-1','ap-southeast-2','ca-central-1','sa-east-1'].map(r=>`https://${r}.zuperpro.com`);
// Regions the key doesn't belong to answer 401/404 or fail CORS — that console noise is expected.
async function resolveByApiKey(key){
  let resolved=null;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
  try{
    await Promise.any(ZUPER_DCS.map(dc=>(async()=>{
      const res=await fetch(dc+'/api/user/company',{headers:{...ZUPER_CLIENT_HDRS,'x-api-key':key},signal:controller.signal}).catch(()=>null);
      if(!res||!res.ok)throw new Error('no match');
      const d=await res.json().catch(()=>({}));
      const name=d?.company_name||d?.data?.company_name||d?.name||d?.data?.name||d?.company?.company_name||'';
      if(!resolved)resolved={dcUrl:dc,baseUrl:dc+'/api/',accountName:name};controller.abort();return resolved;
    })())).catch(()=>{});
  }finally{clearTimeout(timer);}
  if(!resolved)throw new Error('API key not recognised on any known Zuper server. Check the key and try again.');
  return resolved;
}

/* API call. GETs retry on network errors (a 429 without CORS headers reaches the browser
   as "Failed to fetch"). Writes are paced and NOT blindly retried — a write that died on the
   network may have landed, so the executor checks before retrying. */
let _lastWrite=0;
async function api(method,path,body){
  const isGet=method==='GET';
  if(!isGet){const wait=_lastWrite+250-Date.now();if(wait>0)await sleep(wait);_lastWrite=Date.now();}
  for(let attempt=0;attempt<5;attempt++){
    let res;
    try{res=await fetch(conn.base+path,{method,headers:{...ZUPER_CLIENT_HDRS,'x-api-key':conn.key,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});}
    catch(e){
      if(isGet&&attempt<4){await sleep(800*2**attempt);continue;}
      return {ok:false,status:0,network:true,json:null,text:'Network error — '+e.message};
    }
    if((res.status===429||res.status===502||res.status===503)&&attempt<4){const ra=+res.headers.get('Retry-After')||0;await sleep(ra?ra*1000:1200*2**attempt);continue;}
    const text=await res.text().catch(()=>'');let json=null;try{json=JSON.parse(text);}catch(e){}
    return {ok:res.ok&&!(json&&json.type==='error'),status:res.status,json,text};
  }
  return {ok:false,status:429,network:true,json:null,text:'Rate limited'};
}
const listOf=j=>Array.isArray(j?.data)?j.data:Array.isArray(j?.data?.data)?j.data.data:Array.isArray(j)?j:[];
const errOf=r=>(r.json&&(r.json.message||r.json.error))||(r.network?r.text:('HTTP '+r.status+(r.text?': '+r.text.slice(0,140):'')));
function apiErr(r){const e=new Error(errOf(r));e.network=!!r.network;e.status=r.status;return e;}
function manualErr(m){const e=new Error(m);e.manual=true;return e;}
// Page through a list endpoint (first page, then the rest in waves of 4).
async function pagedAll(path,count,maxPages=60){
  const sep=path.includes('?')?'&':'?';
  const first=await api('GET',path+sep+'count='+count+'&page=1');
  if(!first.ok)return null;
  const out=[...listOf(first.json)];
  const total=+(first.json?.total_records||first.json?.total_count||first.json?.data?.total_records||0);
  let pages=total?Math.min(maxPages,Math.ceil(total/count)):(out.length<count?1:maxPages);
  for(let p=2;p<=pages;p+=4){
    const batch=await Promise.all([p,p+1,p+2,p+3].filter(x=>x<=pages).map(x=>api('GET',path+sep+'count='+count+'&page='+x)));
    let short=false;batch.forEach(r=>{const l=r.ok?listOf(r.json):[];out.push(...l);if(l.length<count)short=true;});
    if(short&&!total)break;
  }
  return out;
}

async function connect(){
  const el=$('apikey');const key=el?el.value.trim():'';const btn=$('connectBtn');
  if(!key){showMsg('conn-msg','Enter an API key.','err');return;}
  if(btn){btn.disabled=true;btn.textContent='Connecting…';}
  try{
    const r=await resolveByApiKey(key);
    conn={base:r.baseUrl,key,account:r.accountName||'Account',region:r.dcUrl.replace('https://','').replace('.zuperpro.com','')};
    existing=null;plan=[];
    $('badge').textContent='✓ '+conn.account+' ('+conn.region+')';$('badge').style.display='inline-block';
    render();
    await Promise.all([autofillCompany(false),snapshot()]);
  }catch(e){showMsg('conn-msg','✗ '+e.message,'err');}
  finally{const b=$('connectBtn');if(b){b.disabled=false;b.textContent='Connect';}}
}

// Read what the account already has so the plan skips duplicates (safe re-runs).
async function snapshot(){
  ui.snap={t:'info',m:'Reading the account’s current configuration…'};render();
  const needProducts=B.services.some(s=>s.enabled&&s.name.trim())||B.catalog_items.length>0;
  const [cr,br,notifs,teams,pcats,cfJ,cfC,cfP,prods]=await Promise.all([
    api('GET','jobs/category?populate_statuses=true'),
    api('GET','business_units?filter.keyword=&page=1&count=200&filter.show_all_bu=true'),
    pagedAll('customer_notification',200,10),
    pagedAll('team',200,10),
    pagedAll('products/category',200,10),
    readCustomFields('JOB'),readCustomFields('CUSTOMER'),readCustomFields('PROPERTY'),
    needProducts?pagedAll('product',500,60):Promise.resolve([]),
  ]);
  if(!cr.ok){ui.snap={t:'err',m:'✗ Could not read job categories: '+errOf(cr)};render();return;}
  existing={cats:listOf(cr.json),bus:br.ok?listOf(br.json):[],notifs,teams,pcats:pcats||[],
    cfs:{JOB:cfJ,CUSTOMER:cfC,PROPERTY:cfP},productIds:new Set((prods||[]).map(p=>norm(p.product_id)).filter(Boolean))};
  ui.snap={t:'ok',m:'✓ Read '+conn.account+': '+existing.cats.length+' job categories, '+existing.pcats.length+' product categories, '+existing.productIds.size+' products'+(teams?', '+teams.length+' teams':'')+'.'};
  buildPlanKeepResults();render();
}
async function readCustomFields(m){
  const r=await api('GET','settings/custom_fields?module_name='+m+'&sort=ASC&sort_by=display_order');let l=r.ok?listOf(r.json):[];
  if(!l.length){const g=await api('GET','settings/custom_fields/group?filter.module_name='+m);if(g.ok)l=flattenFields(g.json);}
  return l;
}
function flattenFields(j){const out=[];(function walk(x){if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x==='object'){if(x.custom_field_uid&&x.field_name)out.push(x);else Object.values(x).forEach(walk);}})(j);return out;}
const svcId=s=>'SVC-'+s.name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const catNorm=n=>String(n||'').trim().replace(/\s*\/\s*/g,' & ').replace(/\s+/g,' ')||'Materials';

/* ---------- lookups used to resolve UIDs and to confirm a write landed ---------- */
async function listCategories(){return listOf((await api('GET','jobs/category?populate_statuses=true')).json);}
async function findCategoryUid(name){return (await listCategories()).find(c=>norm(c.category_name)===norm(name))?.category_uid||'';}
async function findStatusUid(cat,name){const c=(await listCategories()).find(x=>x.category_uid===cat);return (c?.job_statuses||[]).find(x=>norm(x.status_name)===norm(name))?.status_uid||'';}
async function findProductCategoryUid(name){const l=await pagedAll('products/category',200,10)||[];const h=l.find(x=>norm(x.category_name||x.product_category_name)===norm(name));return h?.category_uid||h?.product_category_uid||'';}
async function findProductUid(pid){const r=await api('GET','product?count=50&page=1&filter.keyword='+encodeURIComponent(pid));return listOf(r.json).find(p=>norm(p.product_id)===norm(pid))?.product_uid||'';}
async function findNotificationUid(name){const l=await pagedAll('customer_notification',200,10)||[];const h=l.find(e=>norm(e.notification_name)===norm(name));return h?.customer_notification_uid||h?.notification_uid||'';}
async function findTeamUid(name){const l=await pagedAll('team',200,10)||[];return l.find(t=>norm(t.team_name)===norm(name))?.team_uid||'';}
async function findBuUid(name){const r=await api('GET','business_units?filter.keyword=&page=1&count=200&filter.show_all_bu=true');return listOf(r.json).find(b=>norm(b.bu_name)===norm(name))?.bu_uid||'';}
async function readChecklist(cat,st){const r=await api('GET','settings/checklist?category_uid='+cat+'&job_status_uid='+st);return r.ok?listOf(r.json):null;}

/* ---------- plan ----------
   Item: {group,label,sub,action:'create'|'exists'|'manual',key?,run(ctx)→{uid,note},check?(ctx)→uid}
   `key` names the ctx slot holding the item's UID so later items (statuses → messages →
   checklists) can find it. */
function buildPlan(){
  const ex=existing;plan=[];let n=0;const add=o=>plan.push({id:++n,status:'',result:'',...o});
  const catByName=new Map(ex.cats.map(c=>[norm(c.category_name),c]));
  const catUid=(ctx,job)=>ctx['cat:'+norm(job)]||catByName.get(norm(job))?.category_uid||'';
  const stUid=(ctx,job,stage)=>ctx['st:'+norm(job)+'|'+norm(stage)]||(catByName.get(norm(job))?.job_statuses||[]).find(x=>norm(x.status_name)===norm(stage))?.status_uid||'';

  // 1. Business units (trades)
  B.trades.forEach(t=>{const hit=ex.bus.find(b=>norm(b.bu_name)===norm(t));
    add({group:'Business units',label:t,action:hit?'exists':'create',uid:hit?.bu_uid,check:()=>findBuUid(t),
      run:async()=>{const r=await api('POST','business_units',{bu_name:t});if(!r.ok)throw apiErr(r);return{uid:r.json?.data?.bu_uid||r.json?.bu_uid||''};}});});

  // 2. Job categories + statuses
  B.job_types.filter(j=>j.enabled).forEach(j=>{
    const hit=catByName.get(norm(j.name));
    add({group:'Job categories',label:j.name,action:hit?'exists':'create',uid:hit?.category_uid,key:'cat:'+norm(j.name),check:()=>findCategoryUid(j.name),
      run:async()=>({uid:await createCategory(j)})});
    const have=hit?.job_statuses||[];
    j.stages.forEach((s,i)=>{
      const exSt=have.find(x=>norm(x.status_name)===norm(s.name));
      add({group:'Job statuses',label:j.name+' › '+(i+1)+'. '+s.name,sub:s.type,action:exSt?'exists':'create',uid:exSt?.status_uid,key:'st:'+norm(j.name)+'|'+norm(s.name),
        check:async(ctx)=>{const c=catUid(ctx,j.name);return c?findStatusUid(c,s.name):'';},
        run:async(ctx)=>{const c=catUid(ctx,j.name);if(!c)throw new Error('Its job category was not created');return{uid:await createStatus(ctx,s,c)};}});
    });
  });

  // 3. Product categories: the chosen ones, plus whatever services / catalog items need
  const pcatHit=name=>ex.pcats.find(x=>norm(x.category_name||x.product_category_name)===norm(name));
  const pcUid=(ctx,name)=>ctx['pc:'+norm(name)]||pcatHit(name)?.category_uid||pcatHit(name)?.product_category_uid||'';
  const addPcat=(name,sub)=>{name=catNorm(name);if(plan.some(p=>p.key==='pc:'+norm(name)))return;const hit=pcatHit(name);
    add({group:'Product categories',label:name,sub,action:hit?'exists':'create',uid:hit?.category_uid,key:'pc:'+norm(name),check:()=>findProductCategoryUid(name),
      run:async()=>{const r=await api('POST','products/category',{product_category:{category_name:name}});if(!r.ok)throw apiErr(r);
        return{uid:r.json?.data?.category_uid||r.json?.data?.product_category_uid||r.json?.category_uid||await findProductCategoryUid(name)};}});};
  B.product_categories.filter(c=>c.enabled).forEach(c=>addPcat(c.name));
  const svcCat='Roofing Services';const svcs=B.services.filter(s=>s.enabled&&s.name.trim());
  if(svcs.length)addPcat(svcCat,'holds your services');
  B.catalog_items.forEach(it=>addPcat(it.category,'for catalog items'));

  const addProduct=(group,label,sub,pid,catName,product)=>add({group,label,sub,action:ex.productIds.has(norm(pid))?'exists':'create',check:()=>findProductUid(pid),
    run:async(ctx)=>{const c=pcUid(ctx,catNorm(catName));if(!c)throw new Error('Its product category was not created');
      const r=await api('POST','product',{product:{...product,product_id:pid,product_category:c,is_available:true,is_billable:true,consider_profitability:true,is_commissionable:true,quantity:1,min_quantity:1},vendor:[]});
      if(!r.ok)throw apiErr(r);const d=r.json?.data;return{uid:(Array.isArray(d)?d[0]:d)?.product_uid||''};}});
  // 4. Services
  svcs.forEach(s=>addProduct('Services',s.name,svcId(s)+' · '+s.uom+' · '+B.company.currency+' '+s.price,svcId(s),svcCat,
    {product_name:s.name,product_type:'SERVICE',uom:s.uom||'EA',price:+s.price||0}));
  // 5. Catalog materials (SRS / ABC / QXO)
  B.catalog_items.forEach(it=>addProduct('Catalog materials',it.name,(CATALOG[it.src]?.supplier||it.src)+' '+it.id+' → '+catNorm(it.category),it.id,it.category,
    {product_name:it.name||('Part '+it.id),product_type:'PARTS',uom:it.uom||'EA',price:0}));

  // 6. Checklists (one per checklist × job type that has the stage)
  B.checklists.filter(c=>c.enabled&&c.fields.trim()).forEach(c=>{
    const t=targetsFor(c);
    if(!t.length){add({group:'Checklists',label:c.name,sub:'at "'+c.stage+'"',action:'manual',note:'No enabled job type has the stage "'+c.stage+'"'});return;}
    t.forEach(({job})=>add({group:'Checklists',label:c.name+' — '+job.name,sub:parseChecklist(c.fields).length+' questions at "'+c.stage+'"',action:'create',
      run:async(ctx)=>{const cu=catUid(ctx,job.name),su=stUid(ctx,job.name,c.stage);if(!cu||!su)throw new Error('Its job stage was not created');return createChecklist(ctx,cu,su,c);}}));
  });

  // 7. Custom fields
  B.custom_fields.filter(f=>f.enabled&&f.name.trim()).forEach(f=>{
    const exists=(ex.cfs[f.module]||[]).some(x=>norm(x.field_name)===norm(f.name));
    add({group:'Custom fields',label:f.module+' › '+f.name,sub:FIELD_TYPES[f.type],action:exists?'exists':'create',run:async(ctx)=>createCustomField(ctx,f)});
  });

  // 8. Customer notifications (one per job type × stage match)
  B.notifications.filter(x=>x.enabled&&x.body.trim()).forEach(nt=>targetsFor(nt).forEach(({job})=>{
    const label=nt.name+' — '+job.name;
    const exists=Array.isArray(ex.notifs)&&ex.notifs.some(e=>norm(e.notification_name)===norm(label));
    add({group:'Customer notifications',label,sub:nt.type+' at "'+nt.stage+'"',action:exists?'exists':'create',check:()=>findNotificationUid(label),
      run:async(ctx)=>{const cu=catUid(ctx,job.name),su=stUid(ctx,job.name,nt.stage);
        if(!cu||!su)throw new Error('Its job stage was not created');
        const notification={notification_name:label,notification_type:nt.type,job_category:cu,job_status_uid:su,additional_email_recipients:[]};
        if(nt.type==='SMS')notification.sms_body=nt.body;else{notification.email_subject=nt.subject||nt.name;notification.email_body=nt.body;}
        const r=await api('POST','customer_notification',{notification});if(!r.ok)throw apiErr(r);
        return{uid:r.json?.data?.customer_notification_uid||r.json?.data?.notification_uid||''};}});
  }));

  // 9. Teams
  B.teams.filter(t=>t.trim()).forEach(t=>{
    const exists=Array.isArray(ex.teams)&&ex.teams.some(x=>norm(x.team_name)===norm(t));
    add({group:'Teams',label:t,action:exists?'exists':'create',check:()=>findTeamUid(t),run:async(ctx)=>createTeam(ctx,t)});
  });

  // 10. Handover-only items
  B.users.forEach(u=>add({group:'Users',label:(u.first+' '+u.last).trim()||u.email,sub:u.email+' · '+u.role+(u.team?' · '+u.team:''),action:'manual',note:'Invite from Zuper → Users (creating them here would email real people)'}));
  B.integrations.forEach(i=>add({group:'Integrations',label:i,action:'manual',note:'Needs the customer to sign in (OAuth)'}));
  if(B.proposals.gbb||B.proposals.warranty||B.proposals.terms) add({group:'Proposals',label:'Proposal template'+(B.proposals.gbb?' (Good/Better/Best)':''),action:'manual',note:'Build with the CPQ Importer once materials are in'});
}

    require_customer_signature:!!s.sign,require_preview:false,require_customer_feedback:false,require_facial_authentication:false,require_geo_fencing:false,
    parent_status:[],enabled_for_field_executive:!!s.field,enabled_for_manager:true,allow_remarks:true,capture_geo_cords:!!s.field,has_parent:false,
    remarks_values:[],restrict_to_access_role:false,auto_generate_job_template:false,track_time_in_status:!!s.track,enabled_to_access_role:[],
    checklist_view_type:'',prefill_checklist:false};
}
const STATUS_COLORS={NEW:'#3B82F6',SCHEDULED:'#8B5CF6',ON_MY_WAY:'#F59E0B',IN_PROGRESS:'#F97316',COMPLETED:'#16A34A',CANCELLED:'#DC2626',CUSTOM:'#64748B'};
async function createCategory(j){
  const r=await api('POST','jobs/category',{category:{category_name:j.name,category_color:j.color,bu_uids:null,category_description:'',
    estimated_duration:{days:+j.days||0,hours:+j.hours||0,minutes:0},job_timelog:{job_timer:true,travel_timer:true,meal_break_timer:true},auto_create_status:false}});

/* Several Zuper settings endpoints have no published request body. `probe` tries the
   candidate shapes in order, keeps the first one that is accepted (and, where we can read
   it back, verified), and reuses it for the rest of the run. If nothing is accepted the
   item becomes a manual handover task instead of a guess. */
async function probe(ctx,kind,shapes,attempt){
  ctx.shape=ctx.shape||{};ctx.broken=ctx.broken||{};
  if(ctx.broken[kind])throw manualErr(ctx.broken[kind]);
  const learned=ctx.shape[kind];
  const errs=[];
  for(const i of (learned!=null?[learned]:shapes.map((_,i)=>i))){
    const res=await attempt(shapes[i]);
    if(res.ok){if(learned==null){ctx.shape[kind]=i;log('ℹ '+kind+': Zuper accepts "'+shapes[i].n+'"','info');}return res;}
    if(res.network){const e=new Error(res.err);e.network=true;throw e;}
    errs.push(shapes[i].n+' → '+res.err);
  }
  if(learned==null){
    ctx.broken[kind]='Zuper did not accept any known '+kind+' request — set up by hand';
    log('⚠ '+ctx.broken[kind]+'. Responses: '+errs.join(' | '),'warn');
    throw manualErr(ctx.broken[kind]);
  }
  throw new Error(errs.join(' | '));
}
const tryReq=async(method,path,body)=>{const r=await api(method,path,body);return r.ok?{ok:true,r}:{ok:false,err:errOf(r),network:r.network};};

const STATUS_SHAPES=[
  {n:'job_status wrapper',       path:c=>'jobs/status_new/'+c, body:(p,c)=>({job_status:p})},
  {n:'category_uid + job_status',path:c=>'jobs/status_new/'+c, body:(p,c)=>({category_uid:c,job_status:p})},
  {n:'status wrapper',           path:c=>'jobs/status_new/'+c, body:(p,c)=>({status:p})},
  {n:'flat body',                path:c=>'jobs/status_new/'+c, body:(p,c)=>p},
];
async function createStatus(ctx,s,cat){
  const p=statusPayload(s,cat);
  const res=await probe(ctx,'job status',STATUS_SHAPES,sh=>tryReq('POST',sh.path(cat),sh.body(p,cat)));
  const d=res.r.json?.data||res.r.json||{};
  return d.status_uid||d.job_status?.status_uid||(await findStatusUid(cat,s.name))||'';
}

/* Checklist questions: one per line. Type is inferred from the wording. */
function parseChecklist(text){
  return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    let name=line,type='SINGLE_LINE',options=null;
    if(/\(\s*yes\s*\/\s*no\s*\)/i.test(line)){name=line.replace(/\s*\(\s*yes\s*\/\s*no\s*\)\s*/i,'').trim();type='RADIO';options=['Yes','No'];}
    else if(/photo|picture|image/i.test(line))type='FILE';
    else if(/\bdate\b/i.test(line))type='DATE';
    else if(/number of|\(years\)|\bage\b|\bcount\b|squares|layers/i.test(line))type='NUMBER';
    else if(/notes|observed|describe|damages|hazards/i.test(line))type='MULTI_LINE';
    const f={field_name:name,field_type:type,is_required:false,display_order:i+1};
    if(options)f.field_options=options;
    return f;
  });
}
const plainField=f=>({field_name:f.field_name,field_type:'SINGLE_LINE',is_required:false,display_order:f.display_order});
const CHECKLIST_SHAPES=[
  {n:'one question per call, checklist wrapper',per:true,req:(c,s,f)=>['POST','settings/checklist',{checklist:{...f,category_uid:c,job_status_uid:s}}]},
  {n:'one question per call, flat',per:true,             req:(c,s,f)=>['POST','settings/checklist',{...f,category_uid:c,job_status_uid:s}]},
  {n:'one question per call, ids in query',per:true,     req:(c,s,f)=>['POST','settings/checklist?category_uid='+c+'&job_status_uid='+s,f]},
  {n:'whole list, POST',per:false,                       req:(c,s,fs)=>['POST','settings/checklist',{category_uid:c,job_status_uid:s,checklist:fs}]},
  {n:'whole list, PUT',per:false,                        req:(c,s,fs)=>['PUT','settings/checklist',{category_uid:c,job_status_uid:s,checklist:fs}]},
];
async function createChecklist(ctx,cat,st,cl){
  const before=await readChecklist(cat,st);
  if(before===null)throw new Error('Could not read the stage\'s current checklist');
  const have=new Set(before.map(f=>norm(f.field_name||f.label||f.name)));
  const todo=parseChecklist(cl.fields).filter(f=>!have.has(norm(f.field_name)));
  if(!todo.length)return{note:'all questions were already there'};
  let degraded=0;
  // Send (typed first, plain text if that type is rejected); a shape only counts once the
  // stage's checklist actually grows — a 200 that changes nothing is not success.
  const send=async(sh,fields)=>{
    const payload=sh.per?fields[0]:fields;
    let r=await tryReq(...sh.req(cat,st,payload));
    if(!r.ok&&!r.network){const plain=sh.per?plainField(payload):payload.map(plainField);const r2=await tryReq(...sh.req(cat,st,plain));if(r2.ok){r=r2;degraded+=sh.per?1:fields.filter(f=>f.field_type!=='SINGLE_LINE').length;}}
    return r;
  };
  const verified=async(sh,fields)=>{
    const r=await send(sh,fields);if(!r.ok)return r;
    const after=await readChecklist(cat,st);
    return after&&after.length>before.length?{ok:true,r:r.r}:{ok:false,err:'accepted, but no question appeared'};
  };
  // probe() sends (and verifies) the first question — or the whole list for a list shape.
  await probe(ctx,'checklist',CHECKLIST_SHAPES,sh=>verified(sh,sh.per?[todo[0]]:todo));
  const sh=CHECKLIST_SHAPES[ctx.shape.checklist];
  if(sh.per){
    const errs=[];
    for(const f of todo.slice(1)){const r=await send(sh,[f]);if(!r.ok)errs.push(f.field_name+': '+r.err);}
    if(errs.length)throw new Error(errs.length+' of '+todo.length+' question(s) failed — '+errs.slice(0,2).join(' | ')+'. Re-run to retry just those.');
  }
  return{note:todo.length+' question(s) added'+(degraded?' ('+degraded+' as plain text — change the type in Zuper if needed)':'')};
}

const CF_SHAPES=[
  {n:'custom_field wrapper',req:b=>['POST','settings/custom_fields',{custom_field:b}]},
  {n:'flat body',req:b=>['POST','settings/custom_fields',b]},
  {n:'module in query',req:b=>['POST','settings/custom_fields?module_name='+b.module_name,b]},
];
async function createCustomField(ctx,f){
  const body={field_name:f.name,field_type:f.type,module_name:f.module,is_required:false};
  if(['SINGLE_ITEM','MULTI_ITEM'].includes(f.type))body.field_options=String(f.options||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(f.type==='RADIO')body.field_options=['Yes','No'];
  const exists=async()=>(await readCustomFields(f.module)).some(x=>norm(x.field_name)===norm(f.name));
  let plainUsed=false;
  const res=await probe(ctx,'custom field',CF_SHAPES,async sh=>{
    let r=await tryReq(...sh.req(body));
    if(!r.ok&&!r.network&&body.field_type!=='SINGLE_LINE'){const r2=await tryReq(...sh.req({field_name:body.field_name,field_type:'SINGLE_LINE',module_name:body.module_name,is_required:false}));if(r2.ok){r=r2;plainUsed=true;}}
    if(!r.ok)return r;
    return (await exists())?r:{ok:false,err:'accepted, but the field did not appear'};
  });
  return{uid:res.r.json?.data?.custom_field_uid||'',note:plainUsed?'created as text — set the type in Zuper':''};
}

const TEAM_SHAPES=[
  {n:'team wrapper',req:t=>['POST','team',{team:t}]},
  {n:'flat body',req:t=>['POST','team',t]},
  {n:'teams + wrapper',req:t=>['POST','teams',{team:t}]},
];
async function createTeam(ctx,name){
  const t={team_name:name,team_color:'#F97316',team_description:''};
  const res=await probe(ctx,'team',TEAM_SHAPES,async sh=>{
    const r=await tryReq(...sh.req(t));if(!r.ok)return r;
    return (await findTeamUid(name))?r:{ok:false,err:'accepted, but the team did not appear'};
  });
  return{uid:res.r.json?.data?.team_uid||''};
}

    <button class="btn sec hidden" id="stopBtn" onclick="ui.stop=true">■ Stop</button>
    ${lastRun?`<button class="btn sec" onclick="ui.tab='h';render()">Open handover →</button>`:''}</div>
    <div class="log ${ui.logHtml?'':'hidden'}" id="log">${ui.logHtml||''}</div></div>`;
  }
  return h;
}
function planPill(p){return {create:'<span class="pill info">Create</span>',exists:'<span class="pill">Already exists · skip</span>',manual:'<span class="pill">Handover task</span>'}[p.action];}
function resultCell(p){
  if(p.status==='ok')return `<span style="color:var(--ok)">✓ ${esc(p.result||'Created')}</span>`;
  if(p.status==='fail')return `<span style="color:var(--err)">✗ ${esc(p.result)}</span>`;
  if(p.status==='manual')return `<span class="pill man">Set up by hand</span> <span class="muted">${esc(p.result)}</span>`;
  if(p.status==='skip')return `<span class="muted">${esc(p.result)}</span>`;
  return `<span class="muted">${esc(p.note||'')}</span>`;
}
function log(m,c){const l=$('log');if(!l)return;l.classList.remove('hidden');const d=document.createElement('div');if(c)d.className='l-'+c;d.textContent=m;l.appendChild(d);l.scrollTop=l.scrollHeight;ui.logHtml=l.innerHTML;}

// Run one item. On a network failure the write may still have landed, so confirm
// with the item's `check` before trying again — never create twice.
async function runItem(p,ctx){
  for(let attempt=1;;attempt++){
    try{const r=await p.run(ctx)||{};if(p.key&&r.uid)ctx[p.key]=r.uid;return r;}
    catch(e){
      if(e.manual||!(e.network||e.status>=500)||attempt>=4)throw e;
      log('… '+p.label+': connection dropped, checking before retrying','warn');
      await sleep(1500*2**attempt);
      if(p.check){const uid=await p.check(ctx).catch(()=>'');if(uid){if(p.key)ctx[p.key]=uid;return{uid,note:'confirmed after a dropped connection'};}}
    }
  }
}
async function applyPlan(){
  const todo=plan.filter(p=>p.action==='create'&&p.status!=='ok');
  if(!todo.length){alert('Nothing to create. Everything is already in the account or is a handover task.');return;}
  if(!confirm('Create '+todo.length+' item(s) in "'+conn.account+'" ('+conn.region+')?\n\nExisting items are not changed. This cannot be undone automatically.'))return;
  ui.stop=false;const ctx={};
  $('applyBtn').disabled=true;$('stopBtn').classList.remove('hidden');$('prog').classList.remove('hidden');$('log').innerHTML='';ui.logHtml='';
  log('— Applying blueprint to '+conn.account+' —','info');
  let ok=0,fail=0,man=0,done=0;const t0=Date.now();
  for(const p of todo){
    if(ui.stop){log('Stopped by user.','warn');break;}
    try{const r=await runItem(p,ctx);p.status='ok';p.result=[r.note,r.uid].filter(Boolean).join(' · ');ok++;log('✓ '+p.group+': '+p.label+(r.note?' ('+r.note+')':''),'ok');}
    catch(e){if(e.manual){p.status='manual';p.result=e.message;man++;log('◦ '+p.group+': '+p.label+' — '+e.message,'warn');}
      else{p.status='fail';p.result=e.message;fail++;log('✗ '+p.group+': '+p.label+' — '+e.message,'err');}}
    done++;$('progBar').style.width=(done/todo.length*100)+'%';
    const eta=Math.round((Date.now()-t0)/done*(todo.length-done)/1000);$('progTxt').textContent=done+' / '+todo.length+(done<todo.length?' · about '+eta+'s left':'');
  }
  plan.filter(p=>p.action==='exists').forEach(p=>{p.status='skip';p.result='Already existed';});
  lastRun={at:new Date().toISOString(),account:conn.account,region:conn.region,ok,fail,man,items:plan.map(p=>({group:p.group,label:p.label,sub:p.sub||'',action:p.action,status:p.status,result:p.result||p.note||''}))};
  log('— Done: '+ok+' created, '+man+' moved to handover, '+fail+' failed —',fail?'err':'ok');
  await snapshot();   // re-read so the plan reflects what now exists
}

/* ============================================================
   HANDOVER
   ============================================================ */
function renderHandover(){
  if(!lastRun)return `<div class="card"><h2>Handover</h2><p class="desc">Apply the blueprint in the Configure tab first. The handover report lists what was set up and what's left to do.</p></div>`;
  const it=lastRun.items;const grp=(f)=>{const g={};it.filter(f).forEach(x=>(g[x.group]=g[x.group]||[]).push(x));return g;};
  const sect=(g)=>Object.entries(g).map(([k,v])=>`<h3>${esc(k)} <span class="pill">${v.length}</span></h3><ul style="margin:0;padding-left:20px">${v.map(x=>`<li>${esc(x.label)}${x.sub?` <span class="muted small">— ${esc(x.sub)}</span>`:''}</li>`).join('')}</ul>`).join('');
  const done=grp(x=>x.status==='ok'),had=grp(x=>x.status==='skip'),failed=it.filter(x=>x.status==='fail'),manual=grp(x=>x.action==='manual'||x.status==='manual');
  // checklists that did not get created automatically still need their questions listed
  const clDone=new Set(it.filter(x=>x.group==='Checklists'&&(x.status==='ok'||x.status==='skip')).map(x=>norm(x.label.split(' — ')[0])));
  const clTodo=B.checklists.filter(c=>c.enabled&&!clDone.has(norm(c.name)));
  return `<div class="card" id="handover">
  <div class="flex noprint" style="justify-content:flex-end"><button class="btn sec" onclick="window.print()">🖨 Print / PDF</button><button class="btn sec" onclick="downloadUsersCsv()">⬇ Users CSV</button><button class="btn sec" onclick="exportBlueprint()">⬇ Blueprint JSON</button></div>
  <h2>${esc(B.company.name||lastRun.account)}: account handover</h2>
  <p class="desc">Configured ${new Date(lastRun.at).toLocaleString()} in <b>${esc(lastRun.account)}</b> (${esc(lastRun.region)}). ${lastRun.ok} item(s) created, ${lastRun.man||0} to set up by hand, ${lastRun.fail} failed.</p>
  <h2 style="margin-top:20px">✓ Set up for you</h2>${sect(done)||'<p class="muted">Nothing new was created.</p>'}
  ${Object.keys(had).length?`<h2 style="margin-top:20px">Already in the account</h2>${sect(had)}`:''}
  ${failed.length?`<h2 style="margin-top:20px;color:var(--err)">✗ Needs attention</h2><ul>${failed.map(x=>`<li><b>${esc(x.group)}: ${esc(x.label)}</b> <span class="small muted">${esc(x.result)}</span></li>`).join('')}</ul>`:''}
  <h2 style="margin-top:20px">Still to do (onboarding specialist)</h2>${sect(manual)||'<p class="muted">Nothing — everything was set up automatically.</p>'}
  ${clTodo.length?`<h3>Checklist questions to build</h3>${clTodo.map(c=>`<p style="margin:8px 0 2px"><b>${esc(c.name)}</b> <span class="small muted">at "${esc(c.stage)}"</span></p><ul style="margin:0;padding-left:20px">${c.fields.split(/\r?\n/).filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}`:''}
  <h3>Company profile</h3><p class="small">${esc([B.company.address,B.company.timezone,'Hours '+B.company.hours_start+'–'+B.company.hours_end+' ('+B.company.workdays.join(', ')+')','Currency '+B.company.currency,B.payments.terms,B.payments.deposit_pct?'Deposit '+B.payments.deposit_pct+'%':''].filter(Boolean).join(' · '))}</p>
  ${B.proposals.warranty||B.proposals.terms?`<h3>Proposal text</h3><p class="small"><b>Warranty:</b> ${esc(B.proposals.warranty||'—')}</p><p class="small"><b>Terms:</b> ${esc(B.proposals.terms||'—')}</p>`:''}
  ${B.notes?`<h3>Customer notes</h3><p class="small">${esc(B.notes)}</p>`:''}
  </div>`;
}
function downloadUsersCsv(){
  const rows=[['First Name','Last Name','Email','Phone','Role','Team']].concat(B.users.map(u=>[u.first,u.last,u.email,u.phone,u.role,u.team]));
  dl(rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'users.csv','text/csv');
}

/* ============================================================
   SHELL
   ============================================================ */
function dl(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportBlueprint(){dl(JSON.stringify(B,null,2),(B.company.name||'zuper').replace(/[^\w]+/g,'_').toLowerCase()+'_blueprint.json','application/json');}
function importBlueprint(el){
  const f=el.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const b=JSON.parse(rd.result);if(b.version!==1||!Array.isArray(b.job_types))throw new Error('Not a self-onboarding blueprint');B=normalizeBlueprint(b);save();if(existing)buildPlan();render();}catch(e){alert('Could not load: '+e.message);}el.value='';};
  rd.readAsText(f);
}
function resetAll(){if(!confirm('Clear all answers and start from the default roofing template?'))return;B=defaultBlueprint();save();if(existing)buildPlan();ui.step=0;render();}
function showMsg(id,txt,type){const e=$(id);if(!e)return;e.className='msg msg-'+type;e.textContent=txt;e.style.display='block';}

const TABS=[['q','Questionnaire'],['r','Review'],['c','Configure'],['h','Handover']];
function render(){
  $('tabs').innerHTML=TABS.map(([k,l],i)=>`<button class="tab ${ui.tab===k?'on':''}" onclick="ui.tab='${k}';render()"><span class="n">${i+1}</span>${l}</button>`).join('');
  const issueSteps=new Set(issues().map(x=>x.s));
  if(ui.tab==='q'){
    $('main').innerHTML=`<div class="wiz"><div class="steps">${STEPS.map((s,i)=>`<button class="stp ${i===ui.step?'on':''} ${i<ui.step&&!issueSteps.has(i)?'done':''}" onclick="ui.step=${i};render()"><span class="d">${i<ui.step&&!issueSteps.has(i)?'✓':i+1}</span>${s.t}</button>`).join('')}</div>
    <div><div class="card">${STEPS[ui.step].r()}</div>
    <div class="wiznav"><button class="btn sec" ${ui.step===0?'disabled':''} onclick="ui.step--;render();scrollTo(0,0)">← Back</button>
    ${ui.step<STEPS.length-1?`<button class="btn" onclick="ui.step++;render();scrollTo(0,0)">Next →</button>`:`<button class="btn" onclick="ui.tab='r';render();scrollTo(0,0)">Review answers →</button>`}</div></div></div>`;
  }else if(ui.tab==='r'){$('main').innerHTML=renderReview();}
  else if(ui.tab==='c'){if(existing)buildPlanKeepResults();$('main').innerHTML=renderConfigure();}
  else{$('main').innerHTML=renderHandover();}
}
// Rebuild the plan from the latest answers but keep results of items already applied.
function buildPlanKeepResults(){
  const prev=new Map(plan.filter(p=>p.status).map(p=>[p.group+'|'+p.label,p]));buildPlan();
  plan.forEach(p=>{const o=prev.get(p.group+'|'+p.label);if(o){p.status=o.status;p.result=o.result;if(o.status==='ok')p.action='exists';}});
}

/* theme */
function applyThemeLabel(){$('themeBtn').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️ Light':'🌙 Dark';}
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('zuper_tools_theme','light');}catch(e){}}
  else{document.documentElement.setAttribute('data-theme','dark');try{localStorage.setItem('zuper_tools_theme','dark');}catch(e){}}
  applyThemeLabel();
}
applyThemeLabel();render();
</script>
