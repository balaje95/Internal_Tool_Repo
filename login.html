<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Internal Tools</title>
<link rel="icon" href="assets/logos/zuper-favicon.svg">
<link rel="stylesheet" href="assets/zuper-brand.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--zb-font-body);
    background:var(--zb-gradient); color:var(--zb-on-dark); padding:1rem;
  }
  .card {
    background:var(--zb-white); color:var(--zb-ink); border-radius:var(--zb-radius-lg); padding:2rem;
    width:100%; max-width:360px;
    box-shadow:var(--zb-shadow-float); border-top:4px solid var(--zb-primary);
  }
  .card .zb-logo { height:28px; margin:0 0 1.2rem; }
  h1 { margin:0 0 .3rem; font-family:var(--zb-font-display); font-size:1.35rem; font-weight:700;
       letter-spacing:var(--zb-tracking-heading); }
  p.sub { margin:0 0 1.4rem; color:var(--zb-text-2); font-size:.85rem; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--zb-text-2); margin:0 0 .3rem; }
  input {
    width:100%; font:inherit; padding:.6rem .75rem; border:1px solid var(--zb-border-strong);
    border-radius:var(--zb-radius-sm); margin-bottom:1rem;
  }
  input:focus { outline:none; border-color:var(--zb-primary); box-shadow:var(--zb-focus-ring); }
  button {
    width:100%; font:inherit; font-weight:600; color:var(--zb-on-dark); background:var(--zb-primary);
    border:none; border-radius:var(--zb-radius-pill); padding:.65rem; cursor:pointer;
    transition:background var(--zb-duration,200ms) var(--zb-ease);
  }
  button:hover:not(:disabled) { background:var(--zb-primary-hover); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .err { color:var(--zb-error); background:var(--zb-error-bg); border-radius:var(--zb-radius-sm);
         padding:.55rem .7rem; font-size:.82rem; margin:0 0 1rem; }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <img class="zb-logo" src="assets/logos/zuper-horizontal.svg" alt="Zuper">
    <h1>Internal Tools</h1>
    <p class="sub">Sign in to continue</p>
    <p class="err" id="err" hidden></p>
    <label for="u">Username</label>
    <input type="text" id="u" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input type="password" id="p" autocomplete="current-password" required>
    <button type="submit" id="btn">Sign in</button>
  </form>

<script>
  var form = document.getElementById('login-form');
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');

  function nextUrl() {
    var params = new URLSearchParams(window.location.search);
    var n = params.get('next') || '/';
    // Only allow same-origin relative paths.
    if (!n.startsWith('/') || n.startsWith('//')) n = '/';
    return n;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      var res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('u').value,
          password: document.getElementById('p').value
        })
      });
      var data = {};
      try { data = await res.json(); } catch (e2) {}
      if (!res.ok) throw new Error(data.error || 'Sign in failed.');
      window.location.href = nextUrl();
    } catch (ex) {
      err.textContent = ex.message || 'Sign in failed.';
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
